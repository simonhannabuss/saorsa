# nginx config for saorsa.space (use this if the server already runs nginx).
#
# 1. sudo cp deploy/nginx-saorsa.space.conf /etc/nginx/sites-available/saorsa.space
#    sudo ln -s /etc/nginx/sites-available/saorsa.space /etc/nginx/sites-enabled/
# 2. Password file (pick your own username):
#    sudo apt install apache2-utils        # only if htpasswd is missing
#    sudo htpasswd -c /etc/nginx/.htpasswd-saorsa saorsa
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. HTTPS:  sudo certbot --nginx -d saorsa.space -d www.saorsa.space
#    (certbot adds the 443 block and the redirect for you)

server {
    listen 80;
    listen [::]:80;
    server_name saorsa.space www.saorsa.space;

    root /srv/saorsa/web;
    index index.html;

    # Password protection while Saorsa is being built
    auth_basic "Saorsa (private preview)";
    auth_basic_user_file /etc/nginx/.htpasswd-saorsa;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Keep these out of the public web root
    location ~ /\.(git|env) { deny all; }

    # PocketBase API + admin, once it's running on port 8090
    location /pb/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

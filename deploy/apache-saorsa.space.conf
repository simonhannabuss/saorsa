# Apache config for saorsa.space (use this if the server runs Apache without a control panel).
# If the server has cPanel, Plesk or DirectAdmin, use the panel instead – see README.
#
# 1. sudo cp deploy/apache-saorsa.space.conf /etc/apache2/sites-available/saorsa.space.conf
#    sudo a2enmod headers expires proxy proxy_http
#    sudo a2ensite saorsa.space
# 2. Password file:  sudo htpasswd -c /etc/apache2/.htpasswd-saorsa saorsa
# 3. sudo apache2ctl configtest && sudo systemctl reload apache2
# 4. HTTPS:  sudo certbot --apache -d saorsa.space -d www.saorsa.space

<VirtualHost *:80>
    ServerName saorsa.space
    ServerAlias www.saorsa.space
    DocumentRoot /srv/saorsa/web

    <Directory /srv/saorsa/web>
        Options -Indexes
        AllowOverride None
        AuthType Basic
        AuthName "Saorsa (private preview)"
        AuthUserFile /etc/apache2/.htpasswd-saorsa
        Require valid-user
    </Directory>

    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Robots-Tag "noindex, nofollow"

    <Directory /srv/saorsa/web/media>
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
    </Directory>

    # PocketBase API + admin, once it's running on port 8090
    ProxyPass        /pb/ http://127.0.0.1:8090/
    ProxyPassReverse /pb/ http://127.0.0.1:8090/
</VirtualHost>
